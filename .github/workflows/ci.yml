name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same PR cancels the first — no point burning minutes
# on a commit nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` skips lifecycle scripts we don't need here; husky in
      # particular has nothing to install onto a throwaway runner.
      - name: Install
        run: npm ci --ignore-scripts

      # The same gate the pre-push hook runs locally. Hooks can be skipped
      # with --no-verify; this cannot.
      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build
