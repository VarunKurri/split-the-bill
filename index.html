<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Split a restaurant bill by item, with tax and tip shared in proportion to what each person ordered."
    />
    <meta name="theme-color" content="#4F46E5" />
    <title>Split — share a restaurant bill</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      /*
       * Resolve the theme before first paint. Doing this in React instead
       * would render one frame of the light palette and then repaint, which
       * is the white flash every dark-mode site is judged on.
       */
      (function () {
        try {
          var stored = localStorage.getItem('split-the-bill:theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
